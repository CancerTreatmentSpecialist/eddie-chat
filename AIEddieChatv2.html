<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Ask Eddie AI</title>

<style>

html,
body{
    margin:0;
    padding:0;
    height:100%;
    width:100%;
    overflow:hidden;
    background:#eef7f8;
    font-family:-apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

/* Main Container */

.chat-wrapper{
    height:100vh;
    width:100%;
    padding:12px;
    box-sizing:border-box;
}

/* Card */

.chat-card{
    height:100%;
    width:100%;
    background:white;
    border-radius:24px;
    overflow:hidden;

    box-shadow:
      0 10px 30px rgba(0,0,0,.10);
}

/* Header */

.chat-header{

    background:
    linear-gradient(
    135deg,
    #0C6D7F,
    #21C4C7
    );

    color:white;

    padding:18px;

    display:flex;
    flex-direction:column;
}

.title{
    font-size:24px;
    font-weight:700;
}

.subtitle{
    font-size:14px;
    opacity:.95;
}

.status{
    margin-top:6px;
    font-size:12px;
}

.status-dot{
    color:#7CFF9D;
}

/* Chat Frame */

.chat-frame{
    height:calc(100% - 95px);
    width:100%;
    border:none;
}

</style>
</head>

<body>

<div class="chat-wrapper">

    <div class="chat-card">

        <div class="chat-header">

            <div class="title">
                Eddie AI
            </div>

            <div class="subtitle">
                Your Cancer Education Copilot
            </div>

            <div class="status">
                <span class="status-dot">●</span>
                Online
            </div>

        </div>

        https://copilotstudio.microsoft.com/environments/Default-55392b7f-41f9-468a-8aae-c256bc68afe5/bots/Default_eddie/webchat?__version__=2>

    </div>

</div>

</body>
</html>
